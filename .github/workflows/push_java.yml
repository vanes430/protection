name: docker build
on:
  workflow_run:
    workflows: ["update entrypoint"]
    types:
      - completed

jobs:
  push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tag: [8, 11, 17, 21, graaljdk21, graaljdk24, graaljdk25]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PUBLIC_REPO_TOKEN }}

      - uses: docker/build-push-action@v4
        with:
          context: ./
          file: ./${{ matrix.tag }}/Containerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/vanes430/protection:java_${{ matrix.tag }}
