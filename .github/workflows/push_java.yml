name: docker build

on:
  workflow_run:
    workflows: ["update entrypoint"]
    types: [completed]

jobs:
  push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag:
          - 8
          - 11
          - 17
          - 21
          - graaljdk21
          - graaljdk24
          - graaljdk25

    steps:
      # 🧾 Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🧩 Enable QEMU for cross-arch builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 🧱 Enable Buildx for multi-arch
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔐 Login to GitHub Container Registry (GHCR)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.PUBLIC_REPO_TOKEN }}

      # 🏗️ Build and push multi-arch Docker images
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./
          file: ./${{ matrix.tag }}/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/vanes430/protection:java_${{ matrix.tag }}
