name: cleanup
on:
  workflow_run:
    workflows: ["docker1 build1"]
    types:
      - completed

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Delete all untagged and non-latest versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: protection
          package-type: container
          delete-only-untagged-versions: true
          min-versions-to-keep: 1
