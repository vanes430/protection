name: update entrypoint

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-entrypoint:
    # hanya jalan kalau actor == owner repo
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download entrypoint from protection release
        run: |
          curl -L https://github.com/vanes430/protection/releases/download/release/entrypoint -o entrypoint
          chmod +x entrypoint

      - name: Commit and push updated entrypoint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add entrypoint
          git diff --cached --quiet && exit 0
          git commit -m "chore: update entrypoint from protection release"
          git push
