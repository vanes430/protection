name: update entrypoint

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-entrypoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download entrypoint from protection release
        run: |
          curl -L https://github.com/vanes430/protection/releases/download/release/entrypoint -o entrypoint
          chmod +x entrypoint

      - name: Commit and push updated entrypoint
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add entrypoint
          git diff --cached --quiet && exit 0
          git commit -m "chore: update entrypoint from protection release"
          git push https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/${{ github.repository }}.git HEAD:main
